name: Temporary public demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-public-demo
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      AI_PROVIDER: deepseek
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-chat
      CLOUD_ACCESS_PASSWORD: gaokao-demo-8766
      CLOUD_COOKIE_SECURE: "true"
      PAYMENT_ENABLED: "false"
    steps:
      - name: Load application package
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install application
        shell: bash
        run: |
          base64 --decode app.zip.b64 > app.zip
          unzip -q app.zip -d app
          python -m pip install --disable-pip-version-check -r app/requirements.txt

      - name: Start protected demo
        shell: bash
        run: |
          python -m uvicorn app:app --app-dir app --host 127.0.0.1 --port 8766 > server.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8766/healthz; then
              exit 0
            fi
            sleep 2
          done
          cat server.log
          exit 1

      - name: Publish temporary URL
        shell: bash
        run: |
          curl -L --fail --silent --show-error \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url http://127.0.0.1:8766 --no-autoupdate > tunnel.log 2>&1 &
          tunnel_pid=$!
          demo_url=""
          for attempt in {1..60}; do
            demo_url=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
            if [ -n "$demo_url" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$demo_url" ]; then
            cat tunnel.log
            exit 1
          fi
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$demo_url/healthz" > health.json; then
              break
            fi
            sleep 2
          done
          python -c 'import json; data=json.load(open("health.json", encoding="utf-8")); assert data["status"] == "ok" and data["version"] == "11.0.0"'
          curl --fail --silent --show-error --cookie-jar cookies.txt \
            --data 'password=gaokao-demo-8766' "$demo_url/cloud-login" > /dev/null
          curl --fail --silent --show-error --cookie cookies.txt \
            "$demo_url/api/status" > status.json
          python -c 'import json, os; data=json.load(open("status.json", encoding="utf-8")); assert data["provider"] == "deepseek"; assert data["model"] == "deepseek-chat"; assert data["api_key_ready"] == bool(os.getenv("DEEPSEEK_API_KEY", "").strip())'
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            (cd app && python test_ai_connection.py)
          fi
          echo "$demo_url" > LIVE_URL.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LIVE_URL.txt
          git commit -m "Update live demo URL [skip ci]"
          git push
          echo "Temporary URL: $demo_url"
          wait "$tunnel_pid"

